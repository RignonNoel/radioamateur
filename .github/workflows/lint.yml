name: Linting

on:
  push:
  pull_request:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
        working-directory: projects/website
      - name: Run lint
        run: npm run format:check
        working-directory: projects/website
